name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  dsp-tests:
    name: DSP sanity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (tests only, no JUCE download)
        run: cmake -S . -B build-tests -DRC_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build and run
        run: |
          cmake --build build-tests --target dsp_test
          ./build-tests/dsp_test

  plugin:
    name: Plugin (${{ matrix.name }})
    needs: dsp-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }
          - { name: Linux,   os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev mesa-common-dev

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.6-${{ runner.os }}

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "$EXTRA"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect VST3
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/RoobarbPedal_artefacts/Release/VST3/*.vst3 dist/
          ls -R dist | head -40

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RoobarbFuzz-${{ matrix.name }}-VST3
          path: dist/
          if-no-files-found: error
